<g clip-path="url(#tile)"><rect width="520" height="150" fill="#0b0d14"/><rect width="520" height="150" fill="url(#dots)"/><text class="sc-cap" x="16" y="22" text-anchor="start">OPTION CHAINS</text><rect class="sc-box" x="16" y="44" width="78" height="48" rx="8"/><text class="sc-t sc-sm" x="55" y="64" text-anchor="middle">AWS S3</text><text class="sc-s" x="55" y="80" text-anchor="middle">1M+ options</text><path class="sc-wire" d="M94 68L116 68"/><circle class="sc-pkt" cx="94" cy="68" r="2.6" style="--dx:22px;--dy:0px;--i:0"/><text class="sc-cap" x="118" y="22" text-anchor="start">SNOWFLAKE LAYERS</text><g class="sc-light" style="--i:0"><rect class="sc-c1" x="118" y="30" width="96" height="13" rx="3" fill-opacity="0.18"/><text class="sc-s sc-on-tier" x="166" y="39.5" text-anchor="middle">RAW</text></g><g class="sc-light" style="--i:1"><rect class="sc-c1" x="118" y="46" width="96" height="13" rx="3" fill-opacity="0.26"/><text class="sc-s sc-on-tier" x="166" y="55.5" text-anchor="middle">DATA</text></g><g class="sc-light" style="--i:2"><rect class="sc-c1" x="118" y="62" width="96" height="13" rx="3" fill-opacity="0.34"/><text class="sc-s sc-on-tier" x="166" y="71.5" text-anchor="middle">FEATURES</text></g><g class="sc-light" style="--i:3"><rect class="sc-c1" x="118" y="78" width="96" height="13" rx="3" fill-opacity="0.42"/><text class="sc-s sc-on-tier" x="166" y="87.5" text-anchor="middle">PROCESSED</text></g><g class="sc-light" style="--i:4"><rect class="sc-c1" x="118" y="94" width="96" height="13" rx="3" fill-opacity="0.50"/><text class="sc-s sc-on-tier" x="166" y="103.5" text-anchor="middle">ALERTS</text></g><g class="sc-light" style="--i:5"><rect class="sc-c1" x="118" y="110" width="96" height="13" rx="3" fill-opacity="0.58"/><text class="sc-s sc-on-tier" x="166" y="119.5" text-anchor="middle">AGENTS</text></g><path class="sc-wire" d="M214 68L236 68"/><circle class="sc-pkt" cx="214" cy="68" r="2.6" style="--dx:22px;--dy:0px;--i:1"/><text class="sc-cap" x="240" y="22" text-anchor="start">5 GREEKS · UDFs</text><g class="sc-pop" style="--i:0"><circle class="sc-box sc-hot" cx="254" cy="50" r="12"/><text class="sc-t sc-greek" x="254" y="54.5" text-anchor="middle">Δ</text></g><g class="sc-pop" style="--i:1"><circle class="sc-box sc-hot" cx="284" cy="50" r="12"/><text class="sc-t sc-greek" x="284" y="54.5" text-anchor="middle">Γ</text></g><g class="sc-pop" style="--i:2"><circle class="sc-box sc-hot" cx="314" cy="50" r="12"/><text class="sc-t sc-greek" x="314" y="54.5" text-anchor="middle">Θ</text></g><g class="sc-pop" style="--i:3"><circle class="sc-box sc-hot" cx="269" cy="84" r="12"/><text class="sc-t sc-greek" x="269" y="88.5" text-anchor="middle">ν</text></g><g class="sc-pop" style="--i:4"><circle class="sc-box sc-hot" cx="299" cy="84" r="12"/><text class="sc-t sc-greek" x="299" y="88.5" text-anchor="middle">ρ</text></g><path class="sc-wire" d="M330 68L352 68"/><circle class="sc-pkt" cx="330" cy="68" r="2.6" style="--dx:22px;--dy:0px;--i:2"/><text class="sc-cap" x="356" y="22" text-anchor="start">AGENTS FLAG RISK</text><g class="sc-pop" style="--i:5"><rect class="sc-box sc-hot" x="356" y="36" width="148" height="70" rx="10"/><path class="sc-bad" d="M371 52l6 10h-12z"/><text class="sc-t sc-sm" x="382" y="61" text-anchor="start">Concentrated risk</text><text class="sc-s" x="366" y="78" text-anchor="start">Cortex + LLM agents</text><text class="sc-s" x="366" y="93" text-anchor="start">→ Slack + Streamlit</text></g><text class="sc-s sc-foot" x="16" y="140" text-anchor="start">S3 to Snowflake in under 5 minutes, 70% faster market-data preparation</text></g>
